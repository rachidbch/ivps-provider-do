#cloud-config

package_update: true
packages:
  - curl
  - jq

# DO images set an expired root password by default. PAM blocks SSH
# sessions (even key-based) until the password is changed. Set a dummy
# non-expired password to satisfy PAM while keeping SSH key auth primary.
chpasswd:
  list: |
    root:R
  expire: False

ssh_authorized_keys:
  - ${SSH_PUBLIC_KEY}

write_files:
  - path: /etc/tailscale/auth-key
    permissions: '0600'
    content: |
      ${TS_AUTH_KEY}

runcmd:
  # --- Tailscale ---
  - curl -fsSL https://tailscale.com/install.sh | sh
  - tailscale up --authkey=$(cat /etc/tailscale/auth-key) --hostname=${NODE_HOSTNAME} --ssh
  - rm -f /etc/tailscale/auth-key

  # --- Incus (Zabbly repo) ---
  - mkdir -p /etc/apt/keyrings
  - curl -fsSL https://pkgs.zabbly.com/key.asc | gpg --dearmor --yes -o /etc/apt/keyrings/zabbly.gpg
  - |
    echo "deb [signed-by=/etc/apt/keyrings/zabbly.gpg] https://pkgs.zabbly.com/incus/stable $(lsb_release -cs) main" \
      > /etc/apt/sources.list.d/zabbly-incus-stable.list
  - apt-get update -y
  - apt-get install -y incus
  - incus admin init --auto "--network-address=:8443"

  # Bridge DNS. Keep *.incus records (dns.mode=managed), but point the DHCP
  # search suffix at the tailnet domain. Reason: with the internal .incus
  # suffix, a bare name such as 'ssh affine' resolves on eth0 (the bridge)
  # instead of the tailnet IP, so MagicDNS loses. ${TS_DOMAIN} comes from
  # ivps core. Same block as the plugin skeleton.
  # ASCII ONLY in this file: a non-ASCII byte inside a comment made cloud-init
  # discard the whole user-data on DigitalOcean Ubuntu 24.04 (2026-11-06).
  - incus network set incusbr0 dns.mode=managed
  - incus network set incusbr0 dns.search=${TS_DOMAIN}

  # --- Caddy (gateway only) ---
  - |
    if [ "${IS_GATEWAY}" = "true" ]; then
      apt-get install -y debian-keyring debian-archive-keyring apt-transport-https curl
      curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
      curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | tee /etc/apt/sources.list.d/caddy-stable.list
      apt-get update -y
      apt-get install -y caddy
      # API-managed Caddy: the packaged caddy-api.service resumes autosave.json
      # and has no Caddyfile reload that could wipe ivps routes (ivps ADR-019).
      systemctl disable --now caddy
      systemctl enable --now caddy-api
      echo 'TS_PERMIT_CERT_UID=caddy' >> /etc/default/tailscaled
      systemctl restart tailscaled
    fi

final_message: "ivps node ${NODE_HOSTNAME} bootstrapped successfully"
